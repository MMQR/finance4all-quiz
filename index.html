<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance 4All - Quiz Ratios Financiers</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Segoe UI', sans-serif;
background: linear-gradient(135deg, #1c3c72 0%, #1e3c72 0%, #2a5298 100%);
color: #ffffff;
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
}
.container {
max-width: 800px;
width: 100%;
background: rgba(255, 255, 255, 0.1);
backdrop-filter: blur(10px);
border-radius: 20px;
padding: 40px;
box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}
h1 {
text-align: center;
font-size: 2.5rem;
margin-bottom: 10px;
}
.subtitle {
text-align: center;
font-size: 1.2rem;
margin-bottom: 30px;
}
.question {
display: none;
animation: fadeIn 0.5s;
}
.question.active {
display: block;
}
@keyframes fadeIn {
from { opacity: 0; }
to { opacity: 1; }
}
.question-text {
font-size: 1.5rem;
margin-bottom: 30px;
font-weight: 600;
}
.options {
display: flex;
flex-direction: column;
gap: 15px;
}
.option {
padding: 15px 40px;
background: rgba(255, 255, 255, 0.15);
border: none;
border-radius: 8px;
font-size: 1.1rem;
cursor: pointer;
margin-top: 30px;
}
.option:hover {
background: rgba(255, 255, 255, 0.25);
}
.option.selected {
background: rgba(76, 175, 80, 0.5);
border-color: #4CAF50;
}
.option.correct {
background: rgba(76, 175, 80, 0.8);
border-color: #4CAF50;
}
.option.wrong {
background: rgba(244, 67, 54, 0.8);
border-color: #f44336;
}
.btn {
background: #4CAF50;
color: white;
padding: 15px 40px;
border: none;
border-radius: 8px;
font-size: 1.1rem;
cursor: pointer;
margin-top: 30px;
}
.btn:hover {
background: #45a049;
}
.btn:disabled {
background: #cccccc;
cursor: not-allowed;
}
.result {
display: none;
text-align: center;
}
.result.active {
display: block;
}
.score {
font-size: 4rem;
font-weight: bold;
margin: 20px 0;
}
.progress {
text-align: center;
margin-bottom: 20px;
font-size: 1.2rem;
}
</style>
</head>
<body>
<div class="container">
<h1>🎯 Quiz Ratios Financiers</h1>
<p class="subtitle">Finance 4All™</p>
<div class="progress"><span id="current">1</span> / <span id="total">24</span></div><div id="quiz"></div><div id="result" class="result"><h2>🎉 Quiz Terminé !</h2><div class="score" id="scoreDisplay">0/0</div><p id="scorePercent"></p><button class="btn" onclick="location.reload()">Recommencer</button></div></div><script>const questions=[{q:"Quel ratio mesure la capacité d'une entreprise à payer ses dettes à court terme ?",o:["Ratio de liquidité générale","Ratio de rentabilité","Ratio d'endettement","Ratio de rotation"],a:0},{q:"Comment calcule-t-on le ratio de liquidité générale (Current Ratio) ?",o:["Actifs courants / Passifs courants","Passifs courants / Actifs courants","Capitaux propres / Total actif","Résultat net / Chiffre d'affaires"],a:0},{q:"Le ROE (Return on Equity) mesure :",o:["La rentabilité des ventes","La rentabilité des capitaux propres","La liquidité de l'entreprise","L'endettement de l'entreprise"],a:1},{q:"Un ratio d'endettement élevé signifie que :",o:["L'entreprise est très liquide","L'entreprise a beaucoup de dettes par rapport à ses capitaux propres","L'entreprise est très rentable","L'entreprise a beaucoup de stock"],a:1},{q:"Quel ratio mesure la profitabilité sur les ventes ?",o:["Marge bénéficiaire","ROE","ROIC","Ratio de liquidité"],a:0},{q:"Comment est calculé le ratio rapide ?",o:["(Actifs courants - Stocks) / Passifs courants","Actifs courants / Passifs courants","Trésorerie / Passifs courants","Capitaux propres / Total actif"],a:0},{q:"L'indice de solvabilité évalue :",o:["La capacité de court terme à payer les dettes","La capacité de long terme à payer les intérêts et le principal","La rentabilité","L'efficacité opérationnelle"],a:1},{q:"Un ROA (Return on Assets) de 10% signifie :",o:["L'entreprise génère 10% de profit par euro d'actif","L'entreprise a 10% de dettes","L'entreprise grandit à 10% par an","Les stocks représentent 10% des actifs"],a:0},{q:"Quel ratio mesure la rotation des stocks ?",o:["Coût des ventes / Stock moyen","Stock / Actif courant","Ventes / Stocks","Marge / Stock"],a:2},{q:"Un ratio de couverture d'intérêts élevé indique :",o:["L'entreprise a beaucoup de dettes","L'entreprise peut facilement payer ses intérêts","L'entreprise est moins rentable","L'entreprise grandit rapidement"],a:1},{q:"Le ratio prix/bénéfice (P/E) compare :",o:["Le prix de l'action au bénéfice par action","Le prix aux revenus","Le bénéfice au prix des competitors","L'action au marché"],a:0},{q:"Quel est l'impact d'une baisse du ratio rapide ?",o:["Liquidité renforcée","Risque de liquidité augmente","Moins de dettes","Plus de rentabilité"],a:1},{q:"Le ratio des actifs productifs mesure :",o:["L'efficacité d'utilisation des actifs","La rentabilité pure","Le niveau d'endettement","La liquidité"],a:0},{q:"Qu'est-ce qu'un bon ratio de solvabilité ?",o:["Supérieur à 50%","Inférieur à 20%","Entre 30% et 50%","Aucune limite standard"],a:0},{q:"Comment interpréter un EBITDA élevé ?",o:["L'entreprise génère beaucoup de cash","L'entreprise n'a pas de dettes",:["L'entreprise n'a pas de taxes","L'entreprise va disparaître"],a:0},{q:"Le ratio de couverture des dividendes mesure :",o:["La capacité à payer les dividendes","Le prix de l'action","La croissance attendue","Le rendement"],a:0},{q:"Un ratio de rotation des créances faible indique :",o:["Les clients paient vite","Les clients paient lentement","L'entreprise ne vend pas","Les revenus montent"],a:1},{q:"Le ratio de rentabilité nette (RN/CA) mesure :",o:["Le bénéfice par euro de chiffre d'affaires","Le bénéfice par action","La part de marché","La croissance prévue"],a:0},{q:"Un ratio dette-fonds propres (D/E) de 2 signifie :",o:["Il y a 2x plus de dettes que de fonds propres","Il y a 2x plus de fonds propres que de dettes","Les dettes sont le double des revenus","Les fonds propres font 2% du total"],a:0},{q:"Quel ratio est le plus important pour un créancier ?",o:["ROE","Ratio de solvabilité","Rotation des stocks","Marge brute"],a:1},{q:"L'analyse des ratios DuPont décompose :",o:["Le ROE en ses composantes","La trésorerie par source","Les dettes par type","Les revenus par région"],a:0},{q:"Un ratio actuel > 2 peut indiquer :",o:["Bonne liquidité","Trop de liquidité (inefficace)","Problème de trésorerie","Faillite imminente"],a:1},{q:"Le ratio de rendement des capitaux propres (ROIC) compare :",o:["Le résultat opérationnel au capital investi","Le prix à la valeur comptable","Les dividendes au cours de bourse","Les ventes aux stocks"],a:0},{q:"Qu'est-ce qui ne doit PAS être ignoré lors de l'analyse des ratios ?",o:["Le contexte économique et le secteur","Les tendances passées","Les comparaisons peer","Toutes les réponses sont correctes"],a:3}];let currentQ=0,score=0;function renderQ(){const q=questions[currentQ],html=`<div class='question active'><div class='question-text'>${q.q}</div><div class='options'>${q.o.map((opt,i)=>`<button class='option' onclick='selectOpt(${i})'>${opt}</button>`).join('')}</div></div>`;document.getElementById('quiz').innerHTML=html;document.getElementById('current').textContent=currentQ+1}function selectOpt(i){const q=questions[currentQ];if(i===q.a){score++;document.querySelectorAll('.option')[i].classList.add('correct')}else{document.querySelectorAll('.option')[i].classList.add('wrong');document.querySelectorAll('.option')[q.a].classList.add('correct')}document.querySelectorAll('.option').forEach(btn=>btn.disabled=true);setTimeout(()=>{currentQ++;if(currentQ<questions.length){renderQ()}else{showResult()}},1500)}function showResult(){const pct=Math.round(score/questions.length*100);document.getElementById('quiz').style.display='none';document.getElementById('result').classList.add('active');document.getElementById('scoreDisplay').textContent=`${score}/${questions.length}`;document.getElementById('scorePercent').textContent=`${pct>=80?'✅ Excellent !':pct>=60?'👍 Bon résultat !':'📚 À revoir !'}  Score: ${pct}%`}renderQ();</script></body></html>
